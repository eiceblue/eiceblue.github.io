name: Test e-iceblue Repository Download

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Show current IP address
        run: curl -s ifconfig.me || curl -s icanhazip.com

      - name: Test HEAD request (curl -I)
        run: curl -I https://repo.e-iceblue.com/repository/maven-public/e-iceblue/spire.xls/13.4.1/spire.xls-13.4.1.pom

      - name: Test GET request (curl -L)
        run: |
          curl -L -o /tmp/test.pom https://repo.e-iceblue.com/repository/maven-public/e-iceblue/spire.xls/13.4.1/spire.xls-13.4.1.pom
          echo "Download completed:"
          ls -la /tmp/test.pom
